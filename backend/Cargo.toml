[package]
name = "backend"
version = "0.1.0"
edition = "2024"

# `backend` is both the binary package and the workspace root. Every crate the
# binary is decomposed into lives under `crates/` — see the "Directory
# structure" section of CLAUDE.md for the dependency order they must respect.
# Never add a crate outside `crates/`.
[workspace]
members = [
    "crates/api",
    "crates/crypto",
    "crates/db",
    "crates/jobs",
    "crates/labeling",
    "crates/llm",
    "crates/storage",
    "crates/synth",
    "crates/tokenize",
    "crates/training",
]

# The binary is an entrypoint and nothing else, so it depends on exactly what
# `main.rs` names: the HTTP layer to mount, the pool plus the two reconciliation
# queries, the queue and cycle drivers to spawn, and the server itself. Anything
# a *crate* needs belongs in that crate's manifest, not here — if this list
# starts growing again, logic has leaked back into `main.rs`.
[dependencies]
api = { path = "crates/api" }
db = { path = "crates/db" }
jobs = { path = "crates/jobs" }
actix-cors = "0.7.1"
actix-web = "4"
dotenvy = "0.15"
