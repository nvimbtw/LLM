[package]
name = "backend"
version = "0.1.0"
edition = "2024"

# `backend` is both the binary package and the workspace root. Every crate the
# binary is decomposed into lives under `crates/` and is listed here — see the
# "Directory structure" section of CLAUDE.md for the dependency order they must
# respect. Never add a crate outside `crates/`.
[workspace]
members = ["crates/crypto", "crates/db", "crates/llm", "crates/storage", "crates/tokenize", "crates/training"]

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
actix-web = "4"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
actix-cors = "0.7.1"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
actix-ws = "0.3"
actix-multipart = "0.7"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt"] }
crypto = { path = "crates/crypto" }
db = { path = "crates/db" }
llm = { path = "crates/llm" }
storage = { path = "crates/storage" }
tokenize = { path = "crates/tokenize" }
training = { path = "crates/training" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
