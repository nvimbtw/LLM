[package]
name = "synth"
version = "0.1.0"
edition = "2021"

# Generates synthetic SFT/chat data, including the path that calls an external
# model over HTTP. No sqlx and no actix: it writes into `raw/sft/` and returns
# plain values; queueing and serving belong to the layers above.
[dependencies]
llm = { path = "../llm" }
storage = { path = "../storage" }
tokenize = { path = "../tokenize" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt"] }
# default-features = false is deliberate: picking up defaults drags in a second
# TLS stack alongside rustls. Reproduced verbatim from backend/Cargo.toml.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
