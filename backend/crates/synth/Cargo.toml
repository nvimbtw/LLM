[package]
name = "synth"
version = "0.1.0"
edition = "2021"

# Generates synthetic SFT/chat data, over HTTP from a hosted model (the crate
# root) or from a local GGUF on the GPU (`teach`). No sqlx and no actix: it writes
# into `raw/sft/` and returns plain values; queueing and serving belong to the
# layers above.
[dependencies]
llm = { path = "../llm" }
storage = { path = "../storage" }
# The local teacher. `synth` decides what to ask for and what to keep; `teacher`
# only knows how to run a GGUF and hand back text.
teacher = { path = "../teacher" }
tokenize = { path = "../tokenize" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt"] }
# default-features = false is deliberate: picking up defaults drags in a second
# TLS stack alongside rustls. Reproduced verbatim from backend/Cargo.toml.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
