[package]
name = "labeling"
version = "0.1.0"
edition = "2021"

[dependencies]
llm = { path = "../llm" }
storage = { path = "../storage" }
tokenize = { path = "../tokenize" }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1", features = ["v4", "serde"] }
