[package]
name = "teacher"
version = "0.1.0"
edition = "2021"

# Runs a local instruction-tuned model on the GPU to generate training data for
# the model this project trains. Named for the role, not the file format: this is
# the teacher, `llm` is the student. It owns nothing about SFT — it loads a GGUF,
# takes a prompt, and returns text. What to ask for and what to keep belongs to
# `synth`.
[dependencies]
storage = { path = "../storage" }
serde = { version = "1", features = ["derive"] }
# `cuda` is the whole point — the teacher runs on the device. The default
# features come along: `common` carries the sampler chain, `openmp` the CPU
# fallback threading.
llama-cpp-2 = { version = "0.1.153", features = ["cuda"] }
