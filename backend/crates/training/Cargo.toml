[package]
name = "training"
version = "0.1.0"
edition = "2021"

# Builds the datasets a run trains on and owns the entry points into `llm`.
# No sqlx and no actix: a training run is described by a plain `TrainConfig`,
# and persisting or serving the result belongs to the layers above.
[dependencies]
llm = { path = "../llm" }
storage = { path = "../storage" }
tokenize = { path = "../tokenize" }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1", features = ["v4", "serde"] }
