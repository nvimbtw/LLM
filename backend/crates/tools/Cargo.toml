[package]
name = "tools"
version = "0.1.0"
edition = "2021"

# What a model can reach for: a named tool, the argument it was called with, and
# an answer rendered in the marker vocabulary the model reads. Depends on nothing
# else in the workspace — a tool knows about the outside world and about markup,
# and nothing about this project's users, sessions, or the LLM engine process.
[dependencies]
async-trait = "0.1"
# `query` is not in reqwest's default set: it is what percent-encodes a search
# term into the URL, and hand-rolling that is how an injection gets written.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
