[package]
name = "jobs"
version = "0.1.0"
edition = "2021"

# Owns the pool and the single GPU runner. No actix: workers report through a
# broadcast of live frames and an mpsc of progress ticks, and the socket layer
# above subscribes to those.
[dependencies]
db = { path = "../db" }
labeling = { path = "../labeling" }
llm = { path = "../llm" }
storage = { path = "../storage" }
synth = { path = "../synth" }
tokenize = { path = "../tokenize" }
training = { path = "../training" }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
