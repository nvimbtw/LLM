[package]
name = "jobs"
version = "0.1.0"
edition = "2021"

# Owns the pool and the single GPU runner. No actix: workers report through a
# broadcast of live frames and an mpsc of progress ticks, and the socket layer
# above subscribes to those.
[dependencies]
engine = { path = "../engine" }
db = { path = "../db" }
training = { path = "../training" }
chrono = { version = "0.4.45", features = ["serde"] }
# One outbound POST per finished run, to the Discord webhook (see discord.rs).
# Same feature set `synth` already builds, so this adds nothing to the tree.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
