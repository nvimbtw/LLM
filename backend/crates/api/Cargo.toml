[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "../engine" }
auth = { path = "../auth" }
db = { path = "../db" }
jobs = { path = "../jobs" }
training = { path = "../training" }
actix-multipart = "0.7"
actix-web = "4"
actix-ws = "0.3"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
