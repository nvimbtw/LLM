[package]
name = "llm"
version = "0.1.0"
edition = "2021"

[lib]
name = "llm"
path = "src/lib.rs"

[dependencies]
rand = "0.8"
wgpu = "28.0"
bytemuck = { version = "1", features = ["derive"] }
futures = "0.3"
pollster = "0.3"
half = "2"
serde = { version = "1", features = ["derive"] }
tokenize = { path = "../tokenize" }
