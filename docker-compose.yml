# One command for the whole stack:
#
#   docker compose up
#
# Every service hot-reloads from the source tree bind-mounted into it, so this
# is the development setup and not a deployment artifact — `cargo watch` for the
# backend, `next dev` for the frontend, `uvicorn --reload` for all four Python
# services. Restart one without touching the rest:
#
#   docker compose restart backend
#   docker compose logs -f llm-engine
#
# The ports are the ones the root README's port map names, so a browser and a
# host-side `curl` see exactly what they saw before any of this existed. The one
# exception is Postgres, on 5433, because a developer machine usually already
# has one on 5432.

name: slate

# Each is defined once, in the directory that also holds what it needs, and
# included rather than repeated — so the standalone `deploy/<service>/` workflow
# and this file cannot drift apart.
include:
  - deploy/searxng/docker-compose.yml
  - deploy/just-bash/docker-compose.yml

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slate}
      # The backend's. deploy/postgres/init.sql adds the databases the Python
      # services own; it runs once, on an empty volume.
      POSTGRES_DB: llm
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # Named explicitly: without -U the check runs as `root` and fails on a
      # server that has no such role, long after the server is actually up.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slate} -d llm"]
      interval: 2s
      timeout: 3s
      retries: 30

  gyms-engine:
    build:
      context: ./gyms-engine
      target: dev
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8003 --reload"
    environment:
      GYMS_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-slate}:${POSTGRES_PASSWORD:-slate}@postgres:5432/slate_gyms
      GYMS_ENGINE_SERVICE_SECRET: ${GYMS_ENGINE_SERVICE_SECRET:?set it in .env}
      BASH_URL: http://just-bash:8899
    volumes:
      - ./gyms-engine:/app
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      # Not only at startup: creating a run seeds a workspace per episode, and
      # a sandbox that is not up yet turns that into a 502 the moment someone
      # presses the button.
      just-bash:
        condition: service_started

  data-engine:
    build:
      context: ./data-engine
      target: dev
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8002 --reload"
    environment:
      DATA_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-slate}:${POSTGRES_PASSWORD:-slate}@postgres:5432/slate_data
      DATA_ENGINE_SERVICE_SECRET: ${DATA_ENGINE_SERVICE_SECRET:?set it in .env}
    volumes:
      - ./data-engine:/app
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  bench-engine:
    build:
      context: ./bench-engine
      target: dev
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8004 --reload"
    environment:
      BENCH_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-slate}:${POSTGRES_PASSWORD:-slate}@postgres:5432/slate_bench
      BENCH_ENGINE_SERVICE_SECRET: ${BENCH_ENGINE_SERVICE_SECRET:?set it in .env}
      BACKEND_SERVICE_SECRET: ${BACKEND_SERVICE_SECRET:?set it in .env}
      BACKEND_URL: http://backend:8080
    volumes:
      - ./bench-engine:/app
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      postgres:
        condition: service_healthy

  llm-engine:
    build:
      context: ./llm-engine
      target: dev
      # apt and pip need DNS during the build. On hosts whose resolver is
      # reachable from the host but not Docker's build bridge, use that host
      # network for build steps; runtime still uses the Compose network.
      network: host
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8001 --reload"
    environment:
      LLM_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-slate}:${POSTGRES_PASSWORD:-slate}@postgres:5432/slate_engine
      LLM_ENGINE_SERVICE_SECRET: ${LLM_ENGINE_SERVICE_SECRET:?set it in .env}
      # The hop that runs toward the backend: the LLM engine reads, through it, the
      # datasets the data engine owns.
      BACKEND_SERVICE_SECRET: ${BACKEND_SERVICE_SECRET:?set it in .env}
      BACKEND_URL: http://backend:8080
      DATA_DIR: /app/data
      # Lets the caching allocator grow and shrink one segment instead of
      # stranding blocks it cannot merge. Training allocates a few distinct
      # shapes over and over, and the odd one out — a diagnostics pass, a longer
      # final batch — otherwise leaves a hole nothing else fits in. Not a
      # substitute for `loop.release_device`: that hands memory back between
      # runs, this keeps a single run from needing as much.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ./llm-engine:/app
      # Corpora, vocabularies and weights: hundreds of MB that belong to the
      # host tree, not to a container that gets recreated.
      - ./llm-engine/data:/app/data
      # torch.compile's Inductor cache. Without it every first training step
      # after a `docker compose up` pays full compilation cost again.
      - llm-engine-torch-cache:/root/.cache
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    # Needs nvidia-container-toolkit installed on the host. Without it the
    # engine runs on CPU: inference on a small model is bearable, training is
    # not. Left commented out normally because the reservation is not a
    # preference — Compose refuses to start the service at all when no such
    # device exists.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-slate}:${POSTGRES_PASSWORD:-slate}@postgres:5432/llm
      JWT_SECRET: ${JWT_SECRET:?set it in .env}
      # A container's published port cannot reach a loopback binding. This is
      # why the three service secrets above are required rather than optional:
      # unset, they leave the service hops and /internal open, and the loopback
      # binding is no longer there to make that private.
      BIND_ADDR: 0.0.0.0
      GYMS_ENGINE_SERVICE_SECRET: ${GYMS_ENGINE_SERVICE_SECRET:?set it in .env}
      BENCH_ENGINE_SERVICE_SECRET: ${BENCH_ENGINE_SERVICE_SECRET:?set it in .env}
      BENCH_ENGINE_HOST: bench-engine
      BENCH_ENGINE_AUTOSTART: "false"
      GYMS_ENGINE_HOST: gyms-engine
      GYMS_ENGINE_AUTOSTART: "false"
      # All three Python services are their own containers here, so the supervisor
      # attaches to them instead of spawning them as children.
      LLM_ENGINE_AUTOSTART: "false"
      LLM_ENGINE_HOST: llm-engine
      LLM_ENGINE_SERVICE_SECRET: ${LLM_ENGINE_SERVICE_SECRET:?set it in .env}
      DATA_ENGINE_AUTOSTART: "false"
      DATA_ENGINE_HOST: data-engine
      DATA_ENGINE_SERVICE_SECRET: ${DATA_ENGINE_SERVICE_SECRET:?set it in .env}
      BACKEND_SERVICE_SECRET: ${BACKEND_SERVICE_SECRET:?set it in .env}
      SEARCH_URL: http://searxng:8080
      # Set here and not left to backend/.env, which is bind-mounted in and says
      # `http://localhost:8899` — true when the backend runs on the host, and a
      # connection to the container itself when it does not. dotenvy does not
      # overwrite a variable already in the environment, so this wins and the
      # native value stays correct for `cargo run`.
      BASH_URL: http://just-bash:8899
    volumes:
      # Carries backend/.env in with it, which `dotenvy` will read. That is
      # harmless — dotenvy does not overwrite a variable already in the
      # environment, so everything set above wins — but it means a stray key
      # there that compose does *not* set still reaches the process.
      - ./backend:/app
      # A named volume, so an incremental rebuild survives a container restart
      # and the host's target/ — artifacts for a different libc — stays out.
      - backend-target:/app/target
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      llm-engine:
        condition: service_started
      data-engine:
        condition: service_started
      gyms-engine:
        condition: service_started
      bench-engine:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      # The docs renderer resolves these paths one directory above /app. Keep
      # the source tree live in dev so markdown edits are picked up immediately.
      - ./docs:/docs:ro
      - ./README.md:/README.md:ro
      - ./AGENTS.md:/AGENTS.md:ro
      # Masks the host's node_modules: bun resolves some packages per platform,
      # and a tree installed on a macOS host is not loadable in this container.
      - /app/node_modules
      # And masks the host's .next, which is not merely redundant: a tree built
      # natively has the host's absolute paths written into
      # required-server-files.json, and Turbopack resolving against them reports
      # the package it cannot find as missing rather than as misplaced.
      # `.dockerignore` does not cover this — a bind mount bypasses it.
      - frontend-next:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Bind mounts do not deliver inotify events on macOS or Windows, so the
      # dev server has to poll to notice an edit. Costs idle CPU; harmless and
      # unnecessary on Linux, where you can set this to false.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    depends_on:
      # The UI has no useful partial mode: every interactive route goes through
      # the backend. This also makes `docker compose up frontend` bring up the
      # complete request path instead of serving a working docs site beside a
      # dead application.
      backend:
        condition: service_started

volumes:
  postgres-data:
  backend-target:
  llm-engine-torch-cache:
  frontend-next:
