[project]
name = "slate-data-engine"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["postgres: needs a real Postgres server"]
asyncio_mode = "auto"

[tool.coverage.run]
# Module names, not paths: a filename here segfaults coverage 7.15 on 3.14
# rather than reporting a bad config. Same trap as the LLM engine's.
source = ["api", "hub", "processors", "store", "main"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
