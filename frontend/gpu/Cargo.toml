[package]
name = "slate-throbber"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytemuck = "1.25"
wasm-bindgen = "=0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = { version = "0.3.102", features = ["HtmlCanvasElement"] }
wgpu = { version = "28.0.0", default-features = false, features = ["webgpu", "wgsl"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
