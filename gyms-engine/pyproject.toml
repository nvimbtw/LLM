[project]
name = "slate-gyms-engine"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "postgres: needs a real Postgres server",
  "sandbox: needs a real just-bash at BASH_URL",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["api", "gyms", "store", "main"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
